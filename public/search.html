<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Search the Catalog</title>
  <link rel="stylesheet" href="/search.css">
<!-- The shared look (colors, header, footer). Loaded last so it overrides the older rules above. -->
<link rel="stylesheet" href="/theme.css">
<!-- The shared in-page "are you sure?" question (askInline) -->
<script src="/inline-confirm.js"></script>
</head>
<body>
  <header>
    <div>
      <strong>The Quiet Room</strong>
      <span> / Catalog Search</span>
    </div>
    <nav>
      <!-- Links to the holds pages; the page you are on is marked with aria-current -->
      <a href="/search.html" aria-current="page">Search</a>
      <a href="/my-holds.html">My Holds</a>
      <a href="/staff-holds.html">Staff Hold List</a>
      <!-- auth-nav.js puts a Login link or Log out button here -->
      <span id="authLink"></span>
    </nav>
  </header>

  <!-- Banner at the top of the home page: a big search box and one-click category buttons. -->
  <section class="hero">
    <h1>Find your next read.</h1>
    <p>Search books, board games, DVDs and more. See what is on the shelf and place a hold when every copy is out.</p>

    <div class="search-bar">
      <input id="q" type="text" placeholder="Title or author" aria-label="Title or author">
      <select id="category" aria-label="Category">
        <option value="">All categories</option>
        <option value="book">Book</option>
        <option value="videogame">Videogame</option>
        <option value="boardgame">BoardGame</option>
        <option value="dvd">DVD</option>
        <option value="music">Music</option>
        <option value="newspaper">Newspaper</option>
        <option value="researchpaper">ResearchPaper</option>
      </select>
      <button id="go">Search</button>
    </div>

    <!-- One button per category. data-category holds the value the category list uses. -->
    <div class="chips">
      <button type="button" data-category="book">Books</button>
      <button type="button" data-category="boardgame">Board games</button>
      <button type="button" data-category="dvd">DVDs</button>
      <button type="button" data-category="music">Music</button>
      <button type="button" data-category="videogame">Videogames</button>
    </div>

    <p id="message"></p>
  </section>

  <main>
    <!-- Tiles for a logged-in visitor (My Loans, My Holds ...). auth-nav.js fills them and shows them. -->
    <div class="shortcuts" id="shortcuts" hidden></div>

    <!-- A logged-in member's unread notices (overdue items, fines, ready holds). public/home-notices.js
         fills it and shows it; for staff and visitors who are not logged in it stays hidden. -->
    <section class="panel notices" id="notices" hidden aria-label="Your notices"></section>

    <section class="panel">
      <h2>Results</h2>
      <!-- One card per item is added here by search() -->
      <div class="results-grid" id="results"></div>
    </section>
  </main>

  <script>
    // Short descriptions shown on the cards. They live here in the page (not in the database).
    // The key is the title turned into a "slug", the same name as the picture file.
    const DESCRIPTIONS = {
      '1984': 'A man in a totalitarian state, watched by Big Brother, risks everything to think and love freely.',
      'a-relational-model-of-data-for-large-shared-data-banks': 'E. F. Codd\'s 1970 paper that introduced the relational model, the foundation of modern databases.',
      'abbey-road': 'The Beatles\' 1969 album, including "Come Together" and the famous closing medley.',
      'animal-farm': 'The animals drive out their farmer to run the farm themselves, until some become more equal than others.',
      'brave-new-world': 'In a future society engineered for comfort and conformity, one outsider questions the price of happiness.',
      'catan': 'Players build settlements and trade resources to become the leading power on the island of Catan.',
      'database-system-concepts': 'A widely used college textbook on relational databases, SQL, transactions and database design.',
      'dune': 'On the desert planet Arrakis, young Paul Atreides is pulled into a war over the universe\'s most valuable spice.',
      'emma': 'Clever, wealthy Emma Woodhouse plays matchmaker in her village and learns that she has misread everyone, herself included.',
      'fahrenheit-451': 'In a future where books are burned, fireman Guy Montag begins to question his job.',
      'frankenstein': 'A young scientist brings a creature to life, then must face the consequences of abandoning it.',
      'harry-potter-and-the-goblet-of-fire': 'Harry is mysteriously entered in the dangerous Triwizard Tournament during his fourth year at Hogwarts.',
      'harry-potter-and-the-sorcerer-s-stone': 'An orphan boy learns he is a wizard and begins his first year at Hogwarts School of Witchcraft and Wizardry.',
      'houston-chronicle-october-20-2026': 'The Houston Chronicle daily newspaper, issue of October 20, 2026.',
      'jurassic-park': 'A theme park of cloned dinosaurs goes wrong when the power fails and the animals get loose.',
      'lord-of-the-rings': 'A hobbit and his companions set out to destroy a powerful ring and save Middle-earth.',
      'minecraft': 'A sandbox game where players mine resources, build structures and survive in a world made of blocks.',
      'murder-on-the-orient-express': 'Detective Hercule Poirot must solve a murder on a snowbound train where every passenger has a secret.',
      'pride-and-prejudice': 'Elizabeth Bennet and the proud Mr. Darcy must get past first impressions and family pressure to find love.',
      'the-great-gatsby': 'Narrator Nick Carraway watches the rise and fall of the mysterious millionaire Jay Gatsby in 1920s New York.',
      'the-hobbit': 'Bilbo Baggins leaves his comfortable home to help a company of dwarves win back their treasure from a dragon.',
      'the-legend-of-zelda-breath-of-the-wild': 'Link wakes from a long sleep and explores the open kingdom of Hyrule to defeat Calamity Ganon.',
      'the-shawshank-redemption': 'A banker wrongly sent to prison builds an unlikely friendship and never gives up hope of freedom.',
      'thriller': 'Michael Jackson\'s 1982 album, one of the best-selling albums of all time.',
      'ticket-to-ride': 'Players collect train cards and claim railway routes to connect cities across the map.',
      'to-kill-a-mockingbird': 'In a small Southern town, young Scout watches her father defend a Black man falsely accused of a crime.'
    };

    // Turns a title into the name of its picture file, for example
    // "Animal Farm" becomes "animal-farm" (the file is /images/animal-farm.jpg).
    function slugOf(title) {
      return title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    // A plain colored cover with the title on it, used when an item has no picture file.
    function makeFallbackCover(item) {
      const box = document.createElement('div');
      box.className = 'book-cover book-cover-fallback bc-' + String(item.Item_type || 'other').toLowerCase();
      box.textContent = item.Title;
      box.setAttribute('aria-hidden', 'true');   // the title is already written under the cover
      return box;
    }

    // The cover picture for one item. It tries .jpg, then .png, then .webp.
    // If none of them exists, the plain cover takes its place.
    function makeCover(item) {
      const slug = slugOf(item.Title);
      const endings = ['jpg', 'png', 'webp'];
      let tried = 0;
      const img = document.createElement('img');
      img.className = 'book-cover';
      img.alt = '';                               // the title is already written under the cover
      img.width = 128;
      img.height = 192;
      img.loading = 'lazy';
      img.addEventListener('error', () => {
        tried++;
        if (tried < endings.length) img.src = '/images/' + slug + '.' + endings[tried];
        else img.replaceWith(makeFallbackCover(item));
      });
      img.src = '/images/' + slug + '.' + endings[0];
      return img;
    }

    // Makes a small element with a class and some text
    function makeEl(tag, className, text) {
      const el = document.createElement(tag);
      el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    // Runs the search and fills the grid of cards
    async function search() {
      const q = document.getElementById('q').value;
      const category = document.getElementById('category').value;
      const message = document.getElementById('message');
      const grid = document.getElementById('results');

      const url = '/api/search?q=' + encodeURIComponent(q) +
                  '&category=' + encodeURIComponent(category);
      const response = await fetch(url);
      const data = await response.json();

      grid.innerHTML = '';
      if (!response.ok) { message.textContent = data.error || data.message; return; }
      message.textContent = data.length === 0 ? 'No items found.' : '';

      for (const item of data) {
        const card = makeEl('article', 'book-card');
        card.dataset.itemId = item.Item_id;   // lets placeHold() find this card again after the grid is redrawn

        // Top: the cover picture
        const wrap = makeEl('div', 'book-cover-wrap');
        wrap.appendChild(makeCover(item));
        card.appendChild(wrap);

        // Below: category, title, description, availability
        const body = makeEl('div', 'book-body');
        body.appendChild(makeEl('span', 'book-type', item.Item_type));
        body.appendChild(makeEl('h3', 'book-title', item.Title));

        const description = DESCRIPTIONS[slugOf(item.Title)];
        if (description) body.appendChild(makeEl('p', 'book-desc', description));

        const copies = Number(item.available_copies);
        body.appendChild(copies > 0
          ? makeEl('div', 'book-stock in', copies + (copies === 1 ? ' copy available' : ' copies available'))
          : makeEl('div', 'book-stock out', 'No copies on the shelf. Place a hold to join the line.'));

        // Place hold button. Clicking it opens the "are you sure?" strip in this card.
        const actions = makeEl('div', 'book-actions');
        const holdBtn = makeEl('button', '', 'Place hold');
        holdBtn.addEventListener('click', () => askToHold(holdBtn, item));
        actions.appendChild(holdBtn);
        body.appendChild(actions);

        card.appendChild(body);
        grid.appendChild(card);
      }
    }

    // Asks "Place a hold on ...?" in place of the Place hold button, then places the hold on Yes.
    // The question box is the shared one (inline-confirm.js, styled in theme.css).
    async function askToHold(holdBtn, item) {
      // Visitors who are not logged in go to the login page instead
      const meResponse = await fetch('/me');
      const me = await meResponse.json();
      if (!me.loggedIn) { location.href = '/login.html'; return; }

      // askInline hides the button, shows the question with Yes / Cancel, and gives back
      // true (Yes) or false (Cancel). The button comes back by itself afterwards.
      if (await askInline(holdBtn, 'Place a hold on "' + item.Title + '"?', 'Yes, place hold')) {
        placeHold(item.Item_id);
      }
    }

    // Asks the server to place a hold on one item
    async function placeHold(itemId) {
      const message = document.getElementById('message');
      const res = await fetch('/api/holds', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ itemId })
      });
      // Not logged in -> go to the login page
      if (res.status === 401) { location.href = '/login.html'; return; }
      const data = await res.json();
      // Refresh the results first so the available copy count updates.
      // "await" makes us wait until the search has finished, because search() clears the message.
      await search();
      // Show the answer inside the card the member clicked, right under the Place hold button.
      // It is green when the hold was placed and red when it was refused.
      const text = data.message || data.error;
      const card = document.querySelector('#results [data-item-id="' + itemId + '"]');
      if (!card) { message.textContent = text; return; }   // card not on screen any more: use the line under the search bar

      const note = document.createElement('div');
      note.className = 'row-note ' + (res.ok ? 'ok' : 'bad');
      note.setAttribute('role', 'status');                 // screen readers read it out
      note.append(text);
      // A duplicate hold: point the member to the page where the hold can be seen.
      if (res.status === 409) {
        note.append(' You can see it in ');
        const link = document.createElement('a');
        link.href = '/my-holds.html';
        link.textContent = 'My Holds';
        note.append(link, '.');
      }
      card.querySelector('.book-actions').appendChild(note);
    }

    // A category button picks that category in the list and searches right away.
    for (const chip of document.querySelectorAll('.chips button')) {
      chip.addEventListener('click', () => {
        document.getElementById('category').value = chip.dataset.category;
        search();
      });
    }

    document.getElementById('go').addEventListener('click', search);
    document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
    search();
  </script>
  <!-- The member's unread notices on the home page (must load before auth-nav.js, which calls it) -->
  <script src="/home-notices.js"></script>
  <script src="/auth-nav.js"></script>
</body>
</html>
