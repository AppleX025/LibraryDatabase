<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Search the Catalog</title>
  <link rel="stylesheet" href="/search.css">
</head>
<body>
  <header>
    <div>
      <strong>Library Database</strong>
      <span> / Catalog Search</span>
    </div>
    <nav>
      <!-- auth-nav.js puts a Login link or Log out button here -->
      <span id="authLink"></span>
    </nav>
  </header>

  <main>
    <h1>Search the Catalog</h1>
    <p class="muted">Find books, games, DVDs and more by title or author.</p>

    <section class="panel">
      <div class="search-bar">
        <input id="q" type="text" placeholder="Title or author">
        <select id="category">
          <option value="">All categories</option>
          <option value="book">Book</option>
          <option value="videogame">Videogame</option>
          <option value="boardgame">BoardGame</option>
          <option value="dvd">DVD</option>
          <option value="music">Music</option>
          <option value="newspaper">Newspaper</option>
          <option value="researchpaper">ResearchPaper</option>
        </select>
        <button id="go">Search</button>
      </div>

      <p id="message"></p>

      <div class="table-scroll">
        <table>
          <thead>
<tr><th>Title</th><th>Category</th><th>Available copies</th><th></th></tr>          </thead>
          <tbody id="results"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    async function search() {
      const q = document.getElementById('q').value;
      const category = document.getElementById('category').value;
      const message = document.getElementById('message');
      const tbody = document.getElementById('results');

      const url = '/api/search?q=' + encodeURIComponent(q) +
                  '&category=' + encodeURIComponent(category);
      const response = await fetch(url);
      const data = await response.json();

      tbody.innerHTML = '';
      if (!response.ok) { message.textContent = data.error; return; }
      message.textContent = data.length === 0 ? 'No items found.' : '';

      for (const item of data) {
        const tr = document.createElement('tr');
        for (const value of [item.Title, item.Item_type, item.available_copies]) {
          const td = document.createElement('td');
          td.textContent = value;
          tr.appendChild(td);
        }
                // Place hold button (members only; the server checks login)
        const actionTd = document.createElement('td');
        const holdBtn = document.createElement('button');
        holdBtn.textContent = 'Place hold';
        holdBtn.addEventListener('click', () => placeHold(item.Item_id));
        actionTd.appendChild(holdBtn);
        tr.appendChild(actionTd);

        tbody.appendChild(tr);
      }
    }
    // Asks the server to place a hold on one item
    async function placeHold(itemId) {
      const message = document.getElementById('message');
      const res = await fetch('/api/holds', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ itemId })
      });
      // Not logged in -> go to login
      if (res.status === 401) { location.href = '/login.html'; return; }
      const data = await res.json();
      message.textContent = data.message || data.error;
    }
    
    document.getElementById('go').addEventListener('click', search);
    document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
    search();


  </script>
  <script src="/auth-nav.js"></script>
</body>
</html>
