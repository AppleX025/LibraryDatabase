<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Search the Catalog</title>
  <link rel="stylesheet" href="/search.css">
</head>
<body>
  <header>
    <div>
      <strong>Library Database</strong>
      <span> / Catalog Search</span>
    </div>
    <nav>
      <!-- Links to the holds pages; the page you are on is marked with aria-current -->
      <a href="/search.html" aria-current="page">Search</a>
      <a href="/my-holds.html">My Holds</a>
      <a href="/staff-holds.html">Staff Hold List</a>
      <!-- auth-nav.js puts a Login link or Log out button here -->
      <span id="authLink"></span>
    </nav>
  </header>

  <main>
    <h1>Search the Catalog</h1>
    <p class="muted">Find books, games, DVDs and more by title or author.</p>

    <section class="panel">
      <div class="search-bar">
        <input id="q" type="text" placeholder="Title or author">
        <select id="category">
          <option value="">All categories</option>
          <option value="book">Book</option>
          <option value="videogame">Videogame</option>
          <option value="boardgame">BoardGame</option>
          <option value="dvd">DVD</option>
          <option value="music">Music</option>
          <option value="newspaper">Newspaper</option>
          <option value="researchpaper">ResearchPaper</option>
        </select>
        <button id="go">Search</button>
      </div>

      <p id="message"></p>

      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>Title</th><th>Category</th><th>Available copies</th><th></th></tr>
          </thead>
          <tbody id="results"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    // Runs the search and fills the results table
    async function search() {
      const q = document.getElementById('q').value;
      const category = document.getElementById('category').value;
      const message = document.getElementById('message');
      const tbody = document.getElementById('results');

      const url = '/api/search?q=' + encodeURIComponent(q) +
                  '&category=' + encodeURIComponent(category);
      const response = await fetch(url);
      const data = await response.json();

      tbody.innerHTML = '';
      if (!response.ok) { message.textContent = data.error || data.message; return; }
      message.textContent = data.length === 0 ? 'No items found.' : '';

      for (const item of data) {
        const tr = document.createElement('tr');
        for (const value of [item.Title, item.Item_type, item.available_copies]) {
          const td = document.createElement('td');
          td.textContent = value;
          tr.appendChild(td);
        }

        // Place hold button. Clicking it opens the "are you sure?" strip in this row.
        const actionTd = document.createElement('td');
        const holdBtn = document.createElement('button');
        holdBtn.textContent = 'Place hold';
        holdBtn.addEventListener('click', () => askToHold(actionTd, holdBtn, item));
        actionTd.appendChild(holdBtn);
        tr.appendChild(actionTd);

        tbody.appendChild(tr);
      }
    }

    // Shows the "are you sure?" strip in place of the Place hold button
    async function askToHold(cell, holdBtn, item) {
      // Visitors who are not logged in go to the login page instead
      const meResponse = await fetch('/me');
      const me = await meResponse.json();
      if (!me.loggedIn) { location.href = '/login.html'; return; }

      // Close any other strip that is already open, so only one shows at a time
      document.querySelectorAll('.confirm-strip').forEach(s => {
        s.previousElementSibling.classList.remove('is-hidden');
        s.remove();
      });

      // Hide the original button and build the strip
      holdBtn.classList.add('is-hidden');
      const strip = document.createElement('span');
      strip.className = 'confirm-strip';
      strip.setAttribute('role', 'group');
      strip.setAttribute('aria-label', 'Confirm hold');

      const question = document.createElement('span');
      question.textContent = 'Place a hold on "' + item.Title + '"?';

      const yesBtn = document.createElement('button');
      yesBtn.textContent = 'Yes, place hold';
      yesBtn.addEventListener('click', () => {
        strip.remove();
        holdBtn.classList.remove('is-hidden');
        placeHold(item.Item_id);
      });

      const noBtn = document.createElement('button');
      noBtn.textContent = 'Cancel';
      noBtn.className = 'secondary';
      noBtn.addEventListener('click', () => {
        strip.remove();
        holdBtn.classList.remove('is-hidden');
      });

      strip.appendChild(question);
      strip.appendChild(yesBtn);
      strip.appendChild(noBtn);
      cell.appendChild(strip);
    }

    // Asks the server to place a hold on one item
    async function placeHold(itemId) {
      const message = document.getElementById('message');
      const res = await fetch('/api/holds', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ itemId })
      });
      // Not logged in -> go to the login page
      if (res.status === 401) { location.href = '/login.html'; return; }
      const data = await res.json();
      // Refresh the results first so the available copy count updates.
      // "await" makes us wait until the search has finished, because search() clears the message.
      await search();
      // Now set the message, so it stays on the page under the search bar
      message.textContent = data.message || data.error;
    }

    document.getElementById('go').addEventListener('click', search);
    document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
    search();
  </script>
  <script src="/auth-nav.js"></script>
</body>
</html>
