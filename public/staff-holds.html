<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hold List (Staff)</title>
  <link rel="stylesheet" href="search.css">
</head>
<body>
  <nav>
    <a href="/search.html">Search</a> |
    <a href="/my-holds.html">My Holds</a> |
    <a href="/staff-holds.html">Staff Hold List</a> |
    <span id="authLink"></span>
  </nav>
  <script src="/auth-nav.js"></script>

  <h1>Waiting Holds</h1>
  <p>Pick an item to see who is waiting, oldest first.</p>
  <select id="item"></select>
  <p id="message"></p>
  <table>
    <thead>
      <tr><th>#</th><th>Member</th><th>Username</th><th>Placed</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const sel = document.getElementById('item');
    const msg = document.getElementById('message');
    const tbody = document.getElementById('rows');

    // Loads the waiting (Active) holds for the selected item
    async function loadHolds() {
      const res = await fetch('/api/staff/holds/' + sel.value);
      // Not logged in, or not staff -> go to the login page
      if (res.status === 401 || res.status === 403) { location.href = '/login.html'; return; }
      const data = await res.json();
      tbody.innerHTML = '';
      msg.textContent = data.length ? '' : 'No one is waiting for this item.';
      data.forEach((h, i) => {
        const tr = document.createElement('tr');
        const cells = [i + 1, h.First_name + ' ' + h.Last_name, h.Username,
                       new Date(h.Hold_date).toLocaleString()];
        for (const v of cells) {
          const td = document.createElement('td');
          td.textContent = v;
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      });
    }

    // Fill the dropdown with every catalog item (reuses the search route)
    async function init() {
      const items = await (await fetch('/api/search')).json();
      for (const it of items) {
        const o = document.createElement('option');
        o.value = it.Item_id;
        o.textContent = it.Title;
        sel.appendChild(o);
      }
      sel.onchange = loadHolds;
      if (items.length) loadHolds();
    }
    init();
  </script>
</body>
</html>
