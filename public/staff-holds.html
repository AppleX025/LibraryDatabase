<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit the width of a phone screen instead of shrinking -->
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hold List (Staff)</title>
  <!-- The shared look for the search and holds pages (header, card, table, buttons) -->
  <link rel="stylesheet" href="/search.css">
</head>
<body>
  <!-- Top bar. The links go to the three holds-related pages; the page you are
       on is marked with aria-current so the stylesheet can underline it.
       auth-nav.js adds the Login link or Log out button inside <span id="authLink">. -->
  <header>
    <div>
      <strong>Library Database</strong>
      <span> / Staff Hold List</span>
    </div>
    <nav>
      <a href="/search.html">Search</a>
      <a href="/my-holds.html">My Holds</a>
      <a href="/staff-holds.html" aria-current="page">Staff Hold List</a>
      <span id="authLink"></span>
    </nav>
  </header>

  <main>
    <h1>Waiting Holds</h1>
    <p class="muted">Pick an item to see who is waiting for it, oldest first.</p>

    <section class="panel">
      <!-- The dropdown of catalog items. The script fills it with one option per item. -->
      <div class="toolbar">
        <label for="item">Item</label>
        <select id="item"></select>
      </div>

      <!-- "No one is waiting for this item." shows here; hidden while empty. -->
      <p id="message"></p>

      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>#</th><th>Member</th><th>Username</th><th>Placed</th></tr>
          </thead>
          <!-- Starts empty. The script adds one row per waiting hold. -->
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const sel = document.getElementById('item');
    const msg = document.getElementById('message');
    const tbody = document.getElementById('rows');

    // Loads the waiting (Active) holds for the selected item
    async function loadHolds() {
      const res = await fetch('/api/staff/holds/' + sel.value);
      // Not logged in, or not staff -> go to the login page
      if (res.status === 401 || res.status === 403) { location.href = '/login.html'; return; }
      const data = await res.json();
      tbody.innerHTML = '';
      msg.textContent = data.length ? '' : 'No one is waiting for this item.';
      data.forEach((h, i) => {
        const tr = document.createElement('tr');
        const cells = [i + 1, h.First_name + ' ' + h.Last_name, h.Username,
                       new Date(h.Hold_date).toLocaleString()];
        for (const v of cells) {
          const td = document.createElement('td');
          td.textContent = v;
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      });
    }

    // Fill the dropdown with every catalog item (reuses the search route)
    async function init() {
      const items = await (await fetch('/api/search')).json();
      for (const it of items) {
        const o = document.createElement('option');
        o.value = it.Item_id;
        o.textContent = it.Title;
        sel.appendChild(o);
      }
      sel.onchange = loadHolds;
      if (items.length) loadHolds();
    }
    init();
  </script>
  <!-- Adds the Login / Log out control to the <span id="authLink"> in the header -->
  <script src="/auth-nav.js"></script>
</body>
</html>
