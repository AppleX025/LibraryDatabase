<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Makes the page fit the width of a phone screen instead of shrinking -->
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Renew</title>
    <!-- Adan's shared look (header, panel, form fields, buttons, #notice box) -->
    <link rel="stylesheet" href="/catalog-admin.css">
</head>
<body data-access="staff">
    <!-- Top bar. auth-nav.js fills <span id="authLink"> with Login or Log out. -->
    <header>
        <div>
            <strong>Library Database</strong>
            <span> / Renew</span>
        </div>
        <nav>
            <a href="/circulation/checkout.html">Checkout</a>
            <a href="/circulation/return.html">Return</a>
            <a href="/circulation/renew.html">Renew</a>
            <a href="/circulation/open-loans.html">Open loans</a>
            <a href="/fines-admin.html">Fines</a>
            <span id="authLink"></span>
        </nav>
    </header>

    <main>
        <h1>Renew a loan</h1>
        <p class="muted">Scan or type the barcode of the copy the member wants to keep longer.
            Standard loans only; each renewal adds 14 days.</p>

        <!-- Green on success, red (class="error") when a rule is broken. Hidden until there is a message. -->
        <div id="notice" role="status" aria-live="polite" hidden></div>

        <section class="panel">
            <form id="renewForm">
                <label for="barcode">Copy barcode</label>
                <input id="barcode" name="barcode" placeholder="e.g. LIB-0006" autocomplete="off" required autofocus>
                <div class="actions">
                    <button id="submitButton" type="submit">Renew</button>
                    <button type="reset" class="secondary">Clear</button>
                </div>
            </form>
        </section>
    </main>

    <script>
        // How this page works (same pattern as checkout.html, which has
        // line-by-line notes):
        //   1. Staff scan the barcode of the copy the member wants to keep longer.
        //   2. The script sends it to POST /api/circulation/renew, which checks:
        //      standard loan only, within the member type's renewal limit, and
        //      no other member has an Active or Ready hold on the item.
        //   3. If all pass, the due date moves out 14 days; the message shows the
        //      new due date. Otherwise it says which rule stopped the renewal.

        // Grab the parts of the page the script needs to work with.
        const form = document.getElementById('renewForm');
        const notice = document.getElementById('notice');
        const submitButton = document.getElementById('submitButton');

        // Shows a message in the notice box: green normally, red when isError is true.
        function showNotice(message, isError) {
            notice.hidden = false;
            notice.textContent = message;
            notice.classList.toggle('error', isError);
        }

        // Only staff can renew loans. Warn right away instead of after the first try.
        async function checkStaff() {
            const response = await fetch('/me');
            const me = await response.json();
            if (!me.isStaff) {
                showNotice('You must be logged in as staff to renew loans.', true);
                submitButton.disabled = true;
            }
        }

        // Runs on each scan (a scanner presses Enter, which submits the form).
        form.addEventListener('submit', async (event) => {
            // Stop the browser's normal form submit (a full page reload); we send it with fetch instead.
            event.preventDefault();
            // Grey out the button while waiting, so one renewal cannot be sent twice.
            submitButton.disabled = true;

            try {
                // Send the barcode to the server and wait for its answer.
                const response = await fetch('/api/circulation/renew', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ barcode: form.barcode.value })
                });
                const data = await response.json();

                // The server's message gives the new due date, or which rule was broken.
                // response.ok is false for error answers, so those show in red.
                showNotice(data.message, !response.ok);

                // Clear the barcode after a renewal; after an error it stays so staff can see it.
                if (response.ok) {
                    form.barcode.value = '';
                }
                form.barcode.focus();
            } catch (err) {
                // fetch itself failed: the server is not running or the network is down.
                showNotice('Could not reach the server. Please try again.', true);
            } finally {
                // Whatever happened, make the button clickable again.
                submitButton.disabled = false;
            }
        });

        // Run the staff check as soon as the page opens.
        checkStaff();
    </script>
    <!-- Adds the Login / Log out control to the <span id="authLink"> in the header -->
    <script src="/auth-nav.js"></script>
</body>
</html>
