<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Makes the page fit the width of a phone screen instead of shrinking -->
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Checkout</title>
    <!-- Adan's shared look (header, panel, form fields, buttons, #notice box) -->
    <link rel="stylesheet" href="/catalog-admin.css">
</head>
<body data-access="staff">
    <!-- Top bar. auth-nav.js fills <span id="authLink"> with Login or Log out. -->
    <header>
        <div>
            <strong>Library Database</strong>
            <span> / Checkout</span>
        </div>
        <nav>
            <a href="/circulation/checkout.html">Checkout</a>
            <a href="/circulation/return.html">Return</a>
            <a href="/circulation/renew.html">Renew</a>
            <a href="/circulation/open-loans.html">Open loans</a>
            <a href="/fines-admin.html">Fines</a>
            <span id="authLink"></span>
        </nav>
    </header>

    <main>
        <h1>Check out an item</h1>
        <p class="muted">Type the member's username or email: their holds appear below, each with a Check out button. For anything else, scan or type the copy's barcode as well.</p>

        <!-- Green on success, red (class="error") when a rule is broken. Hidden until there is a message. -->
        <div id="notice" role="status" aria-live="polite" hidden></div>

        <section class="panel">
            <!-- novalidate turns off the browser's own "Please fill out this field" popup.
                 If something is missing, the server says which box to fill (for example
                 "Enter a copy barcode or a member.") and the page shows it in the red notice box above. -->
            <form id="checkoutForm" novalidate>
                <div class="form-grid">
                    <div>
                        <label for="barcode">Copy barcode</label>
                        <input id="barcode" name="barcode" placeholder="e.g. LIB-0001" autocomplete="off">
                    </div>
                    <div>
                        <label for="member">Member username or email</label>
                        <input id="member" name="member" placeholder="e.g. testmember" autocomplete="off">
                    </div>
                </div>
                <div class="actions">
                    <button id="submitButton" type="submit">Check out</button>
                    <button type="reset" class="secondary">Clear</button>
                </div>
            </form>
        </section>

        <!-- Filled in by the script below as staff type a member: that member's open holds,
             each with a Check out button when a copy can be handed over now.
             Hidden until a member with a username or email is typed. -->
        <section class="panel" id="readyHolds" style="margin-top: 16px" hidden>
            <h2>Holds</h2>
            <p class="muted" id="readyHoldsMember"></p>
            <ul id="readyHoldsList"></ul>
        </section>
    </main>

    <script>
        // How this page works:
        //   1. Staff fill in the barcode and member, then press "Check out".
        //   2. The script sends both values to POST /api/circulation/checkout
        //      (routes/circulation.js), which checks every lending rule.
        //   3. The server answers with a message, which is shown in the notice
        //      box: green if the loan was saved, red if a rule said no.
        // All the rules are checked on the server, never here, because anything
        // in the browser can be changed by the person using it.

        // Grab the parts of the page the script needs to work with.
        const form = document.getElementById('checkoutForm');
        const notice = document.getElementById('notice');
        const submitButton = document.getElementById('submitButton');

        // Shows a message in the notice box: green normally, red when isError is true.
        // textContent (not innerHTML) puts the message in as plain text, so a title
        // or name containing "<" can never break the page.
        function showNotice(message, isError) {
            notice.hidden = false;
            notice.textContent = message;
            notice.classList.toggle('error', isError);   // adds the red style, or removes it
        }

        // Only staff can check items out. Warn right away instead of after the first try.
        // GET /me (routes/auth.js) answers e.g. { loggedIn: true, isStaff: false }.
        async function checkStaff() {
            const response = await fetch('/me');
            const me = await response.json();
            if (!me.isStaff) {
                showNotice('You must be logged in as staff to check out items.', true);
                submitButton.disabled = true;
            }
        }

        // Sends one checkout to the server and shows the answer in the notice box.
        // Used by both ways of checking out: the form below, and the "Check out" buttons
        // in the "Holds ready for pickup" box. Returns true if the loan was saved.
        //   barcode: the copy's barcode, member: the member's username or email.
        async function checkOut(barcode, member) {
            try {
                // Send the two values to the server as JSON. "await" pauses here
                // until the server answers.
                const response = await fetch('/api/circulation/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ barcode: barcode, member: member })
                });
                // Every answer from the route is JSON with a "message".
                const data = await response.json();

                // The server's message says what happened, or which rule was broken.
                // response.ok is true for success codes (200, 201) and false for errors
                // (400 rule broken, 403 not staff, 500 server problem), so errors show red.
                showNotice(data.message, !response.ok);
                return response.ok;
            } catch (err) {
                // fetch itself failed: the server is not running or the network is down.
                showNotice('Could not reach the server. Please try again.', true);
                return false;
            }
        }

        // Runs when the form is submitted (the button is clicked, or Enter is pressed,
        // which is what a barcode scanner does after each scan).
        form.addEventListener('submit', async (event) => {
            // Stop the browser's normal form submit (a full page reload); we send it with fetch instead.
            event.preventDefault();
            // Grey out the button while waiting, so one checkout cannot be sent twice.
            submitButton.disabled = true;

            const saved = await checkOut(form.barcode.value, form.member.value);

            // On success, clear the barcode so the next item can be scanned for the same member.
            if (saved) {
                form.barcode.value = '';
                form.barcode.focus();
                // A hold may just have been picked up, so reload the "ready" list.
                showReadyHolds();
            }
            // Whatever happened, make the button clickable again.
            submitButton.disabled = false;
        });

        // ---- The member's holds -------------------------------------------------
        // As staff type the member (username or email), ask the server for that member's
        // open holds (GET /api/circulation/member-holds) and list each one. A hold that can
        // be handed over now gets a "Check out" button and shows the copy's barcode; the button
        // sends that barcode for staff, so they do not have to type it.
        const readyHoldsBox = document.getElementById('readyHolds');
        const readyHoldsMember = document.getElementById('readyHoldsMember');
        const readyHoldsList = document.getElementById('readyHoldsList');

        // Hides the list and empties it (used when the member box is cleared or the member is unknown).
        function clearReadyHolds() {
            readyHoldsBox.hidden = true;
            readyHoldsList.replaceChildren();   // removes every <li> inside the list
        }

        // holdNote(hold): the words after the title that say where the hold stands.
        function holdNote(hold) {
            if (hold.status === 'Ready') return 'ready, pick up by ' + hold.expiryDate;
            if (hold.barcode) return 'copy available, hold placed ' + hold.placedDate;
            if (hold.ahead > 0) return 'waiting, ' + hold.ahead + (hold.ahead === 1 ? ' member' : ' members') + ' ahead in line';
            return 'waiting for a copy to be returned';
        }

        // Asks the server for the member's open holds and shows them.
        async function showReadyHolds() {
            const memberText = form.member.value.trim();
            if (!memberText) {
                clearReadyHolds();
                return;
            }
            try {
                // encodeURIComponent makes the typed text safe to put in an address
                // (for example, the "@" and "+" in an email).
                const response = await fetch('/api/circulation/member-holds?member=' + encodeURIComponent(memberText));
                // The member box may have been edited while we waited; then this answer is
                // for someone else, and the newer request will show the right list.
                if (form.member.value.trim() !== memberText) return;
                if (!response.ok) {
                    // Unknown member or not staff: the checkout itself will explain, so just hide the list.
                    clearReadyHolds();
                    return;
                }
                const data = await response.json();

                readyHoldsList.replaceChildren();
                readyHoldsMember.textContent = data.holds.length === 0
                    ? data.member + ' has no open holds.'
                    : data.member + ' has ' + data.holds.length + (data.holds.length === 1 ? ' open hold.' : ' open holds.');

                for (const hold of data.holds) {
                    const item = document.createElement('li');
                    if (hold.barcode) {
                        // A button (not a link) because clicking it does the checkout.
                        const button = document.createElement('button');
                        button.type = 'button';          // so it does not submit the checkout form
                        button.textContent = 'Check out';
                        button.addEventListener('click', async () => {
                            // Grey out the button while waiting, so one checkout cannot be sent twice.
                            button.disabled = true;
                            // memberText is the member this list was built for, even if the box was edited since.
                            const saved = await checkOut(hold.barcode, memberText);
                            if (saved) {
                                // The hold is now Completed, so reload the list (it drops out).
                                showReadyHolds();
                            } else {
                                button.disabled = false;   // let staff try again after a rule message
                            }
                        });
                        item.append(button, ' ');
                    }
                    // textContent keeps titles with "<" or "&" from being read as HTML.
                    // The barcode (when a copy can be handed over) is shown so staff can find the copy.
                    const copyText = hold.barcode ? ' [' + hold.barcode + ']' : '';
                    item.append(hold.title + copyText + ' (' + holdNote(hold) + ')');
                    readyHoldsList.append(item);
                }
                readyHoldsBox.hidden = false;
            } catch (err) {
                // The list is only a helper; if it cannot load, staff can still type the barcode.
                clearReadyHolds();
            }
        }

        // Show the holds while staff are typing: wait until they pause for 400 ms,
        // so the server is not asked after every single letter.
        let holdsTimer = null;
        form.member.addEventListener('input', () => {
            clearTimeout(holdsTimer);                       // restart the wait
            holdsTimer = setTimeout(showReadyHolds, 400);
        });
        // "change" fires when the box loses focus after its text was edited (Tab or a click elsewhere).
        form.member.addEventListener('change', showReadyHolds);
        // The Clear button resets the form, so hide the list too.
        form.addEventListener('reset', clearReadyHolds);

        // Run the staff check as soon as the page opens.
        checkStaff();
    </script>
    <!-- Adds the Login / Log out control to the <span id="authLink"> in the header -->
    <script src="/auth-nav.js"></script>
</body>
</html>
