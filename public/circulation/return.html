<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Makes the page fit the width of a phone screen instead of shrinking -->
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Return</title>
    <!-- Adan's shared look (header, panel, form fields, buttons, #notice box) -->
    <link rel="stylesheet" href="/catalog-admin.css">
<!-- The shared look (colors, header, footer). Loaded last so it overrides the older rules above. -->
<link rel="stylesheet" href="/theme.css">
</head>
<body data-access="staff">
    <!-- Top bar. auth-nav.js fills <span id="authLink"> with Login or Log out. -->
    <header>
        <div>
            <strong>The Quiet Room</strong>
            <span> / Return</span>
        </div>
        <nav>
            <a href="/circulation/checkout.html">Checkout</a>
            <a href="/circulation/return.html">Return</a>
            <a href="/circulation/renew.html">Renew</a>
            <a href="/circulation/open-loans.html">Open loans</a>
            <a href="/fines-admin.html">Fines</a>
            <span id="authLink"></span>
        </nav>
    </header>

    <main>
        <h1>Return an item</h1>
        <p class="muted">Enter the ID number of the copy being returned.</p>

        <!-- Green on success, red (class="error") when something is wrong. Hidden until there is a message. -->
        <div id="notice" role="status" aria-live="polite" hidden></div>

        <section class="panel">
            <form id="returnForm">
                <label for="copy_id">Copy ID</label>
                <input id="copy_id" name="copy_id" type="number" min="1" step="1" placeholder="e.g. 2" autocomplete="off" required autofocus>

                <!-- How the copy came back. 'Returned OK' is the normal case; the other
                     two add a replacement-cost fine (see POST /api/circulation/return). -->
                <label for="outcome">Condition on return</label>
                <select id="outcome" name="outcome">
                    <option value="ok" selected>Returned OK</option>
                    <option value="damaged">Damaged</option>
                    <option value="lost">Lost</option>
                </select>

                <div class="actions">
                    <button id="submitButton" type="submit">Return</button>
                    <button type="reset" class="secondary">Clear</button>
                </div>
            </form>
        </section>
    </main>

    <script>
        // How this page works (same pattern as checkout.html, which has
        // line-by-line notes):
        //   1. Staff enter the returned copy's ID.
        //   2. Staff pick how the copy came back (OK / damaged / lost).
        //   3. The script sends the copy ID and that choice to
        //      POST /api/circulation/return, which closes the open loan (return
        //      date + returning staff saved together).
        //   4. The database then puts an OK copy back to 'available' and, if it
        //      was late, adds the overdue fine. A damaged or lost copy instead
        //      gets a replacement-cost fine, and a lost copy is taken out of
        //      circulation. The server's message says what happened.

        // Grab the parts of the page the script needs to work with.
        const form = document.getElementById('returnForm');
        const notice = document.getElementById('notice');
        const submitButton = document.getElementById('submitButton');

        // Shows a message in the notice box: green normally, red when isError is true.
        function showNotice(message, isError) {
            notice.hidden = false;
            notice.textContent = message;
            notice.classList.toggle('error', isError);
        }

        // Only staff can return items. Warn right away instead of after the first try.
        async function checkStaff() {
            const response = await fetch('/me');
            const me = await response.json();
            if (!me.isStaff) {
                showNotice('You must be logged in as staff to return items.', true);
                submitButton.disabled = true;
            }
        }

        // Runs when the form is submitted (the button is clicked or Enter is pressed).
        form.addEventListener('submit', async (event) => {
            // Stop the browser's normal form submit (a full page reload); we send it with fetch instead.
            event.preventDefault();
            // Grey out the button while waiting, so one return cannot be sent twice.
            submitButton.disabled = true;

            try {
                // Send the copy ID to the server and wait for its answer.
                const response = await fetch('/api/circulation/return', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ copy_id: form.copy_id.value, outcome: form.outcome.value })
                });
                const data = await response.json();

                // The server's message says what happened (late? fine? holds waiting?) or what went wrong.
                // response.ok is false for error answers, so those show in red.
                showNotice(data.message, !response.ok);

                // Clear the copy ID so the next returned item can be entered straight away.
                // (After an error it stays, so staff can see and fix what they typed.)
                if (response.ok) {
                    form.copy_id.value = '';
                    // Back to the normal choice so the next return does not carry
                    // over a 'damaged' or 'lost' selection by accident.
                    form.outcome.value = 'ok';
                }
                form.copy_id.focus();
            } catch (err) {
                // fetch itself failed: the server is not running or the network is down.
                showNotice('Could not reach the server. Please try again.', true);
            } finally {
                // Whatever happened, make the button clickable again.
                submitButton.disabled = false;
            }
        });

        // Run the staff check as soon as the page opens.
        checkStaff();
    </script>
    <!-- Adds the Login / Log out control to the <span id="authLink"> in the header -->
    <script src="/auth-nav.js"></script>
</body>
</html>
