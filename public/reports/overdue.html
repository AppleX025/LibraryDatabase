<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Overdue Loans Report</title>
    <style>
        /* Simple report look: full-width table with borders and a shaded header row */
        body { font-family: Arial, sans-serif; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .num { text-align: right; }                      /* right-align number columns */
        #summary { margin: 1rem 0; font-weight: bold; }  /* the line above the table */
    </style>
</head>
<body>
    <h1>Overdue Loans</h1>
    <!-- The script replaces this text with the totals line, or with an error message -->
    <p id="summary">Loading...</p>

    <table>
        <thead>
            <tr>
                <th>Member</th><th>Email</th><th>Title</th><th>Barcode</th>
                <th>Due Date</th><th class="num">Days Overdue</th><th class="num">Fine so far</th>
            </tr>
        </thead>
        <!-- The script adds one <tr> per overdue loan inside this tbody -->
        <tbody id="rows"></tbody>
    </table>

    <script>
        // Makes text safe to put inside HTML, so a name containing "<" cannot break the page.
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Gets the report rows from the server and fills the table.
        async function loadReport() {
            // 1. Ask the server for the report (the staff-only route in routes/reports.js).
            const response = await fetch('/api/reports/overdue');
            const data = await response.json();

            // If the visitor is not logged in, or is not staff, the server answers
            // with an error message instead of a list of loans. Show that message
            // and stop here, because the loop below needs a list.
            if (!response.ok) {
                document.getElementById('summary').textContent = data.message;
                return;
            }

            // 2. Start with an empty table body and a running total of the fines.
            const rowsContainer = document.getElementById('rows');
            rowsContainer.innerHTML = '';
            let totalFine = 0;

            // 3. Add one table row for every overdue loan.
            for (const row of data) {
                // MySQL sends the fine as text (for example "5.60"). Turning it into
                // a number lets us add the amounts and format them.
                const fine = parseFloat(row.fine_so_far);

                // Build the row as text. Names, emails, titles and barcodes were typed
                // by people, so they go through escapeHtml. due_date arrives as a full
                // timestamp, and slice(0, 10) keeps only the date part (YYYY-MM-DD).
                // overdue_days is a number from the database, so it is shown as it is.
                // The fine is shown with a $ and two decimals (3.5 becomes 3.50).
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${escapeHtml(row.member_name)}</td>
                    <td>${escapeHtml(row.member_email)}</td>
                    <td>${escapeHtml(row.title)}</td>
                    <td>${escapeHtml(row.barcode)}</td>
                    <td>${escapeHtml(row.due_date.slice(0, 10))}</td>
                    <td class="num">${row.overdue_days}</td>
                    <td class="num">$${fine.toFixed(2)}</td>
                `;
                rowsContainer.appendChild(tr);

                totalFine += fine;   // add this loan's fine to the total
            }

            // 4. Replace "Loading..." with the summary line above the table.
            // data.length is the number of overdue loans (one row per loan).
            document.getElementById('summary').textContent =
                `${data.length} overdue loans, total fines so far: $${totalFine.toFixed(2)}`;
        }

        // Start loading the report as soon as the page opens.
        loadReport();
    </script>
</body>
</html>
