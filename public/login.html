<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Library Login</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <header>
    <div>
      <strong>Library Database</strong>
      <span> / Login</span>
    </div>
  </header>

  <main>
    <section class="panel">
      <h1>Library Login</h1>
      <p class="muted">Sign in with your username or email.</p>

      <!-- The form has no action or method on purpose. Instead of a normal form
           submit (which reloads the page), the script below intercepts the
           submit and sends the data with fetch(). -->
      <form id="loginForm">
        <!-- One field accepts either a username (members) or an email (staff,
             who have no username). The server decides which one it is. -->
        <label for="username">Username or email</label>
        <input type="text" id="username" required>

        <label for="password">Password</label>
        <!-- type="password" hides the characters as they're typed -->
        <input type="password" id="password" required>

        <button type="submit">Log in</button>
      </form>

      <!-- Searching the catalog does not need an account -->
      <p class="muted"><a href="/search.html">Back to search</a></p>

      <!-- Visitors without an account can register as a member -->
      <p class="muted"><a href="/register.html">Create an account</a></p>

      <!-- Empty paragraph where login errors are displayed.
           login.css shows it as a red box only when it has text. -->
      <p id="message"></p>
    </section>
  </main>

  <script>
    // Run this function when the form is submitted
    // (by clicking the button or pressing Enter in a field).
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      // Stop the browser's default behavior (a full page reload/navigation)
      // so we can handle the login ourselves.
      e.preventDefault();

      // Send the credentials to the POST /login route in routes/auth.js.
      // The Content-Type header tells the server the body is JSON, which
      // express.json() in app.js parses into req.body.
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });

      // Read the JSON the server sent back
      // (e.g. { isStaff: true } on success, or { message: '...' } on failure).
      const data = await res.json();

      if (res.ok) {
        // res.ok is true for 2xx status codes, meaning login succeeded.
        // The server has already stored the session; the browser keeps the
        // session cookie automatically. Staff land on the catalog page and members
        // on the search page; both show the full menu for their role.
        window.location.href = data.isStaff ? '/catalog-admin.html' : '/search.html';
      } else {
        // Login failed (wrong password, inactive account, etc.).
        // Show the server's error message under the form.
        document.getElementById('message').textContent = data.message;
      }
    });
  </script>
</body>
</html>
