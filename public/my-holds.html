<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit the width of a phone screen instead of shrinking -->
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Holds</title>
  <!-- The shared look for the search and holds pages (header, card, table, buttons) -->
  <link rel="stylesheet" href="/search.css">
</head>
<body>
  <!-- Top bar. The links go to the three holds-related pages; the page you are
       on is marked with aria-current so the stylesheet can underline it.
       auth-nav.js adds the Login link or Log out button inside <span id="authLink">. -->
  <header>
    <div>
      <strong>Library Database</strong>
      <span> / My Holds</span>
    </div>
    <nav>
      <a href="/search.html">Search</a>
      <a href="/my-holds.html" aria-current="page">My Holds</a>
      <a href="/staff-holds.html">Staff Hold List</a>
      <span id="authLink"></span>
    </nav>
  </header>

  <main>
    <h1>My Holds</h1>
    <p class="muted">Items you are waiting for, and the ones that are ready for you to pick up.</p>

    <!-- The white card that holds the table. #message shows "You have no holds."
         or the result of pressing Cancel; it stays hidden while it is empty. -->
    <section class="panel">
      <p id="message"></p>

      <!-- The scroll wrapper lets a wide table scroll sideways on small screens
           instead of breaking the page. -->
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>Title</th><th>Status</th><th>Placed</th><th>Expires</th><th></th></tr>
          </thead>
          <!-- Starts empty. The script adds one row per hold. -->
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    // Loads the logged-in member's holds and fills the table
    async function load() {
      const res = await fetch('/api/my-holds');
      // Not logged in -> go to the login page
      if (res.status === 401) { location.href = '/login.html'; return; }
      const data = await res.json();
      const msg = document.getElementById('message');
      const tbody = document.getElementById('rows');
      tbody.innerHTML = '';
      if (!res.ok) { msg.textContent = data.error || data.message; return; }
      msg.textContent = data.length ? '' : 'You have no holds.';

      for (const h of data) {
        const tr = document.createElement('tr');
        const cells = [
          h.Title,
          h.Status,
          new Date(h.Hold_date).toLocaleDateString(),
          h.Expiry_date ? new Date(h.Expiry_date).toLocaleDateString() : ''
        ];
        for (const v of cells) {
          const td = document.createElement('td');
          td.textContent = v;
          tr.appendChild(td);
        }
        // Cancel button only for open holds
        const td = document.createElement('td');
        if (h.Status === 'Active' || h.Status === 'Ready') {
          const b = document.createElement('button');
          b.textContent = 'Cancel';
          b.onclick = async () => {
            const r = await fetch('/api/holds/' + h.Hold_id + '/cancel', { method: 'POST' });
            const d = await r.json();
            msg.textContent = d.message || d.error;
            load();
          };
          td.appendChild(b);
        }
        tr.appendChild(td);
        tbody.appendChild(tr);
      }
    }
    load();
  </script>
  <!-- Adds the Login / Log out control to the <span id="authLink"> in the header -->
  <script src="/auth-nav.js"></script>
</body>
</html>
